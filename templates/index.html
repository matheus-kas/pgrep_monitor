<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monitor de Replicação PostgreSQL -  Rede Auto Shopping</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <div class="container">
    <header>
      <h1><i class="fas fa-database"></i> Monitor de Replicação PostgreSQL -  Rede Auto Shopping </h1>
      <div class="header-controls">
        <div class="last-update" id="lastUpdate" role="status" aria-live="polite">Última atualização: -</div>
        <div class="controls" role="region" aria-label="Controles de atualização">
          <button id="btnRefresh" class="btn" title="Atualizar agora"><i class="fas fa-sync"></i> Atualizar</button>
          <label for="selectInterval" class="sr-only">Intervalo de atualização</label>
          <select id="selectInterval" aria-label="Intervalo de atualização automática">
            <option value="5000">Auto 5s</option>
            <option value="15000">Auto 15s</option>
            <option value="30000">Auto 30s</option>
            <option value="0">Desativar</option>
          </select>
          <span id="autoUpdateStatus" class="status-info">Ativado</span>
          <span id="dataAge" class="status-info" aria-live="polite">Idade dos dados: -</span>
          <button id="btnTheme" class="btn" title="Alternar tema" aria-pressed="false"><i class="fas fa-moon"></i></button>
        </div>
      </div>
    </header>

    <div class="dashboard">
      <div class="card system-info">
        <h2><i class="fas fa-info-circle"></i> Informações do Sistema</h2>
        <div id="systemInfo" class="card-content skeleton" aria-live="polite"></div>
      </div>

      <div class="card replica-status">
        <h2><i class="fas fa-sync"></i> Status da Réplica</h2>
        <div id="replicaMode" class="card-content skeleton" aria-live="polite"></div>
      </div>

      <div class="card replica-lag">
        <h2><i class="fas fa-clock"></i> Lag de Replicação</h2>
        <div id="replicaLag" class="card-content skeleton" aria-live="polite"></div>
        <div class="chart-wrap">
          <canvas id="lagChart" height="120" aria-label="Gráfico de lag de replicação" role="img"></canvas>
        </div>
      </div>

      <div class="card replication-status">
        <h2><i class="fas fa-network-wired"></i> Status de Replicação</h2>
        <div id="replicationStatus" class="card-content skeleton" aria-live="polite"></div>
      </div>
    </div>

    <footer>
      <p>Monitor PostgreSQL · Rede Auto Shopping</p>
    </footer>
  </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>

<!-- Modal de detalhes -->
<div id="detailModal" class="modal" role="dialog" aria-hidden="true" aria-labelledby="modalTitle">
  <div class="modal-content">
    <button id="modalClose" class="btn" aria-label="Fechar modal">Fechar</button>
    <h3 id="modalTitle">Detalhes</h3>
    <div id="modalBody"></div>
  </div>
</div>
</body>
</html>
