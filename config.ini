[monitor]
# Liga/desliga a thread de monitoramento em background
enabled = true
# Intervalo entre verificações de lag (segundos)
check_interval_seconds = 30
# CRÍTICO quando o WAL recebido e ainda não aplicado passa deste tamanho (bytes).
# 16777216 = 16 MB (um segmento de WAL). Este é o critério real de atraso.
lag_threshold_bytes = 16777216
# (informativo) atraso em tempo apenas exibido; não dispara mais o alerta sozinho
lag_threshold_seconds = 30
# Intervalo do relatório periódico de status (segundos). Ex.: 3600 = 1h
report_interval_seconds = 3600
