[monitor]
enabled = true
check_interval_seconds = 30
# Lag em segundos: warn / critical
lag_threshold_seconds = 30
lag_critical_seconds = 300
# Lag em bytes: warn (50 MB) / critical (150 MB)
lag_threshold_bytes = 52428800
lag_critical_bytes = 157286400
# Limpeza WAL: minutos sem limpeza para warn / critical
cleanup_warn_minutes = 90
cleanup_critical_minutes = 180
report_interval_seconds = 3600